name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  # Lets a human manually trigger this pipeline on demand (e.g. to
  # spin infra back up for a demo session) without needing a new code
  # change to merge first.
  workflow_dispatch:

# id-token: write is required to request an OIDC token from GitHub at
# all -- without it, neither infra job could authenticate to AWS
# regardless of what their IAM roles' trust policies allow.
permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

  source-branch-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from dev
        if: github.head_ref != 'dev'
        run: |
          echo "PRs into main must come from the dev branch (got '${{ github.head_ref }}')."
          exit 1

  # Whether infra/** changed -- gates the two infra jobs below so they
  # don't run (and don't need AWS credentials at all) on ordinary app
  # code changes. Skipped entirely for a manual workflow_dispatch run,
  # since infra-apply's own condition already bypasses this check for
  # that trigger type.
  detect-infra-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  infra-plan:
    if: github.event_name == 'pull_request' && needs.detect-infra-changes.outputs.infra == 'true'
    needs: detect-infra-changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: prints the real OIDC token's claims so the trust
      # policy's sub condition can be matched against ground truth
      # instead of guessed -- two guesses already failed. Remove once
      # the actual sub value is confirmed and the trust policy fixed.
      - name: Debug - show real OIDC token claims
        run: |
          python3 << 'EOF'
          import urllib.request, json, base64, os

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})
          token = json.loads(urllib.request.urlopen(req).read())["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          interesting = {k: v for k, v in claims.items() if k in ("sub", "aud", "iss", "repository", "event_name", "ref", "head_ref", "base_ref")}
          print(json.dumps(interesting, indent=2))
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-plan
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform init
      # -lock=false: the read-only role can't write the S3 state lock
      # (ReadOnlyAccess has no s3:PutObject/DeleteObject) -- fine for a
      # preview that never writes state, not fine for apply below.
      - run: terraform plan -lock=false

  infra-apply:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-infra-changes.outputs.infra == 'true')
    needs: [lint-and-test, detect-infra-changes]
    runs-on: ubuntu-latest
    # Referencing this environment is what makes this job pause for a
    # manual approval click -- the required-reviewer rule lives in the
    # repo's environment settings, not in this file.
    environment: infra-deploy
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-deploy
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform init
      - run: terraform apply -auto-approve
