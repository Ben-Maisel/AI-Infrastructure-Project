name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  # Manual trigger, e.g. to redeploy without a new commit
  workflow_dispatch:

# id-token: for OIDC; pull-requests: to post the plan as a PR comment
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

  source-branch-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from dev
        if: github.head_ref != 'dev'
        run: |
          echo "PRs into main must come from the dev branch (got '${{ github.head_ref }}')."
          exit 1

  # Gates the infra jobs so ordinary app commits skip AWS entirely
  detect-infra-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  infra-plan:
    if: github.event_name == 'pull_request' && needs.detect-infra-changes.outputs.infra == 'true'
    needs: detect-infra-changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-plan
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform init
      # Read-only role can't write the state lock
      - run: terraform plan -lock=false -no-color | tee plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan_output.txt', 'utf8').slice(-60000);
            const marker = '<!-- terraform-plan-comment -->';
            const body = `${marker}\n### Terraform Plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  infra-apply:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-infra-changes.outputs.infra == 'true')
    needs: [lint-and-test, detect-infra-changes]
    runs-on: ubuntu-latest
    # Pauses for approval -- required-reviewer rule is on the repo's environment settings
    environment: infra-deploy
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: decode the real OIDC token for this exact job/event
      # to verify the deploy role's trust policy against ground truth --
      # a real merge already failed auth here despite a policy that
      # looks correct by analogy to the verified pull_request/dev cases.
      - name: Debug - show real OIDC token claims
        run: |
          python3 << 'EOF'
          import urllib.request, json, base64, os

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})
          token = json.loads(urllib.request.urlopen(req).read())["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps(claims, indent=2))
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-deploy
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform init
      - run: terraform apply -auto-approve
