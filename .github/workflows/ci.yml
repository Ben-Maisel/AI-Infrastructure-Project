name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

  # Future stages, added as the project grows:
  # - eval-suite: run the fixed eval prompt set against the agent
  # - build: build and push the Docker image
  # - deploy-staging: deploy the built image to staging
  # - deploy-prod: manual-approval gate promoting staging -> prod
