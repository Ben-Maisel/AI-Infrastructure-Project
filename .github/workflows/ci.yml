name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  # Manual trigger, e.g. to redeploy without a new commit
  workflow_dispatch:

# id-token: for OIDC; pull-requests: to post the plan as a PR comment
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

  source-branch-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from dev
        if: github.head_ref != 'dev'
        run: |
          echo "PRs into main must come from the dev branch (got '${{ github.head_ref }}')."
          exit 1

  # Gates the infra jobs so ordinary app commits skip AWS entirely.
  # build-and-push-app used to be gated the same way on app-path
  # changes, but cluster-addons/ resources (the population Job, and
  # eventually the app Deployment) need an image tagged with the
  # current commit's SHA to exist for every push to main, not just
  # ones that touched agent/ -- so it now always runs on push instead.
  detect-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      # base is ignored entirely for pull_request events (paths-filter
      # already diffs correctly against the PR's own base branch) --
      # this only takes effect for push, where it defaults to "the
      # repository's default branch" rather than the actual pre-push
      # commit, and mis-triggered infra-apply on a merge that only
      # touched destroy.yml. github.event.before is the exact SHA main
      # pointed to immediately before this push, straight from
      # GitHub's own event payload.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            infra:
              - 'infra/**'
              - '!infra/trust/**'
              - '!infra/bootstrap/**'

  infra-plan:
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.infra == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-plan
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Read-only role can't write the state lock
      - name: Plan infra/
        working-directory: infra
        run: |
          terraform init
          terraform plan -lock=false -no-color | tee plan_output.txt

      # -refresh=false: the plan role has no EKS access entry, so it
      # can't read the Kubernetes-backed resources here live -- this
      # shows what's in state rather than a fully live-verified diff.
      - name: Plan infra/cluster-addons/
        working-directory: infra/cluster-addons
        run: |
          terraform init
          terraform plan -refresh=false -lock=false -no-color | tee plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const infraPlan = fs.readFileSync('infra/plan_output.txt', 'utf8').slice(-30000);
            const addonsPlan = fs.readFileSync('infra/cluster-addons/plan_output.txt', 'utf8').slice(-30000);
            const marker = '<!-- terraform-plan-comment -->';
            const body = `${marker}\n### Terraform Plan\n\n<details><summary>infra/</summary>\n\n\`\`\`\n${infraPlan}\n\`\`\`\n\n</details>\n\n<details><summary>infra/cluster-addons/ (state-only preview, not live-refreshed)</summary>\n\n\`\`\`\n${addonsPlan}\n\`\`\`\n\n</details>`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  infra-apply:
    # needs: on a job silently requires success() on all of them unless
    # the if below calls a status function itself. !cancelled() (not
    # always()) opts out of that so a workflow_dispatch run isn't
    # skipped just because detect-changes (skipped on purpose for
    # that event) "didn't succeed" -- always() would also run this after
    # a user cancels the whole workflow, which we don't want for a job
    # that applies real infrastructure.
    if: |
      !cancelled() &&
      needs.lint-and-test.result == 'success' &&
      needs.build-and-push-app.result != 'failure' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.infra == 'true')
      )
    needs: [lint-and-test, detect-changes, build-and-push-app]
    runs-on: ubuntu-latest
    # Pauses for approval -- required-reviewer rule is on the repo's environment settings
    environment: infra-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-deploy
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # infra/ must exist first -- cluster-addons/ reads its outputs
      # (cluster endpoint/CA) to configure the helm/kubectl providers.
      - name: Apply infra/
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve

      # app_image_tag: build-and-push-app is now a needs: dependency
      # above specifically so this SHA is guaranteed to already exist
      # in ECR by the time this runs (workflow_dispatch reruns skip
      # rebuilding -- the image for the current HEAD commit was already
      # pushed by the push event that originally landed it on main).
      - name: Apply infra/cluster-addons/
        working-directory: infra/cluster-addons
        env:
          TF_VAR_app_image_tag: ${{ github.sha }}
        run: |
          terraform init
          terraform apply -auto-approve

  # No approval gate -- pushing an image has no effect until a
  # separate, still-gated deploy actually uses it. Narrow, ECR-only
  # role (infra/trust/github_actions_ecr_push_role.tf), not the
  # admin-wide deploy role above.
  #
  # Runs on every push to main, not just agent/-touching ones --
  # cluster-addons/ resources need an image tagged with the current
  # commit's SHA to exist unconditionally (immutable tags mean there's
  # no "latest" to fall back to). Docker layer caching plus ECR
  # already having identical layers from prior pushes make a rebuild
  # of an unchanged app cheap.
  build-and-push-app:
    if: |
      !cancelled() &&
      needs.lint-and-test.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      # Registry (for login) vs. repository (for build/push) are
      # different things -- login authenticates to the whole registry,
      # not one repo within it.
      ECR_REGISTRY: 786830914740.dkr.ecr.us-east-2.amazonaws.com
      ECR_REPOSITORY: 786830914740.dkr.ecr.us-east-2.amazonaws.com/ai-infra-project-app
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-ecr-push
          aws-region: us-east-2

      - run: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin "${{ env.ECR_REGISTRY }}"

      # Tagged with the commit SHA, never latest -- the repo's
      # image_tag_mutability is IMMUTABLE, so a reused tag would fail.
      - run: docker build -t "${{ env.ECR_REPOSITORY }}:${{ github.sha }}" .
      - run: docker push "${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
