name: Enforce Branch Policy

on:
  pull_request:
    branches: [main]

jobs:
  source-branch-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from dev
        if: github.head_ref != 'dev'
        run: |
          echo "PRs into main must come from the dev branch (got '${{ github.head_ref }}')."
          exit 1
