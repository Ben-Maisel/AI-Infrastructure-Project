name: Infra

on:
  pull_request:
    branches: [main]
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

# id-token: write is required to request an OIDC token from GitHub at
# all -- without it, this workflow has no way to prove its identity to
# AWS regardless of what the IAM role's trust policy allows.
permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-deploy
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform init
      - run: terraform plan

  apply:
    # Only after a real merge to main, and only after plan succeeded --
    # never runs on a PR, which only ever gets the plan/preview above.
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    # Referencing this environment is what makes this job pause for a
    # manual approval click -- the actual required-reviewer rule lives
    # in the repo's environment settings, not in this file.
    environment: infra-deploy
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-deploy
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform init
      - run: terraform apply -auto-approve
