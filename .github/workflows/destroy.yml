name: Destroy Infra

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Ungated -- so the plan is visible before anyone approves the actual
  # destroy below (a gate you can't see through is no gate at all).
  # -refresh=false reads only the state file, not live AWS/Kubernetes
  # APIs, so the read-only plan role's lack of any EKS access entry
  # never comes into play here.
  destroy-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-plan
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # cluster-addons/ first -- shown in the order it'll actually be destroyed.
      # app_image_tag has no default -- without a value here, terraform
      # hangs prompting for it forever on this non-interactive runner
      # (same bug already hit and fixed in ci.yml's infra-plan). Any
      # value works, this is destroy-only and never pulls the image.
      - name: Preview destroy of infra/cluster-addons/
        working-directory: infra/cluster-addons
        env:
          TF_VAR_app_image_tag: ${{ github.sha }}
        run: |
          terraform init
          terraform plan -destroy -refresh=false -lock=false -no-color

      - name: Preview destroy of infra/
        working-directory: infra
        run: |
          terraform init
          terraform plan -destroy -refresh=false -lock=false -no-color

  infra-destroy:
    needs: destroy-plan
    runs-on: ubuntu-latest
    # Same approval gate as infra-apply in ci.yml.
    environment: infra-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-deploy
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: azure/setup-kubectl@v4

      # Karpenter-provisioned nodes were never created by Terraform (it
      # calls the EC2 API directly), so `terraform destroy` can't clean
      # them up -- and destroying cluster-addons/ next removes
      # Karpenter's own controller before it could notice and do it
      # itself. Deleting NodeClaims here, while the controller is still
      # running, triggers Karpenter's real graceful termination (drain,
      # evict, then terminate the instance) -- kubectl delete blocks
      # until that finalizer work actually finishes. Skipping this
      # orphaned a node for 20+ minutes and failed the whole workflow.
      #
      # Tolerates the cluster already being gone: "re-run failed jobs"
      # restarts from step 1, not where it left off, and a prior
      # attempt can have already destroyed the cluster while still
      # failing overall (e.g. on a later VPC/ENI cleanup step) --
      # without this check, the re-run fails here immediately and
      # skips the remaining, still-needed destroy steps.
      - name: Scale down workloads and drain Karpenter-provisioned nodes
        run: |
          if ! aws eks describe-cluster --name ai-infra-project --region us-east-2 >/dev/null 2>&1; then
            echo "Cluster already gone -- nothing to drain."
            exit 0
          fi
          aws eks update-kubeconfig --name ai-infra-project --region us-east-2

          # app's Service is type: LoadBalancer -- AWS provisions a real
          # Classic ELB outside Terraform's direct tracking, same shape
          # of problem as Karpenter's NodeClaims below. Deleting it here
          # explicitly, with --wait (kubectl's own default, which waits
          # for finalizers -- confirmed via kubectl's docs), guarantees
          # the ELB is actually gone before infra/'s VPC destroy runs,
          # rather than trusting the kubectl_manifest provider's own
          # delete path to do the same (untested). Independent of
          # whether Karpenter/NodeClaims exist at all, so this runs
          # before that check below, not nested inside it.
          kubectl delete service app -n default --wait --timeout=5m --ignore-not-found

          # cluster-addons/ (Karpenter itself, and the NodeClaim type
          # it registers) may never have been applied at all -- e.g. an
          # infra/ apply that got cancelled before reaching
          # cluster-addons/. Nothing to drain in that case either.
          if ! kubectl get crd nodeclaims.karpenter.sh >/dev/null 2>&1; then
            echo "Karpenter's NodeClaim CRD doesn't exist -- nothing to drain."
            exit 0
          fi

          # Scale workloads to 0 first -- proven necessary for real:
          # deleting a NodeClaim evicts its pod, but if the Deployment
          # (default namespace only -- never kube-system, where
          # Karpenter's own controller and CoreDNS live and need to
          # stay alive to process this) still exists, the ReplicaSet
          # controller immediately recreates the pod, which a
          # still-running Karpenter then builds a brand-new node for --
          # orphaning a second node even after the drain below already
          # "worked."
          kubectl scale deployment --all --replicas=0 -n default
          kubectl wait --for=delete pod --all -n default --timeout=2m || true

          # 5m wasn't enough for a GPU NodeClaim in practice: the
          # underlying EC2 instance terminates fine within that window,
          # but Karpenter's own reconciliation afterward (confirm
          # termination, delete the Node object, remove the NodeClaim's
          # finalizer -- which is what --wait actually blocks on) took
          # longer than 5m for a g4dn.xlarge with its 100Gi volume.
          kubectl delete nodeclaims --all --wait=true --timeout=10m

      # cluster-addons/ must go first -- the Helm release's uninstall
      # needs the cluster's API server to still exist to process it.
      # Same missing-variable hang risk as the preview above -- this is
      # the real destroy, so if this one hangs the whole teardown blocks
      # for real, not just a status comment.
      - name: Destroy infra/cluster-addons/
        working-directory: infra/cluster-addons
        env:
          TF_VAR_app_image_tag: ${{ github.sha }}
        run: |
          terraform init
          terraform destroy -auto-approve

      - name: Destroy infra/
        working-directory: infra
        run: |
          terraform init
          terraform destroy -auto-approve
