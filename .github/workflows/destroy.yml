name: Destroy Infra

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Ungated -- so the plan is visible before anyone approves the actual
  # destroy below (a gate you can't see through is no gate at all).
  # -refresh=false reads only the state file, not live AWS/Kubernetes
  # APIs, so the read-only plan role's lack of any EKS access entry
  # never comes into play here.
  destroy-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-plan
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # cluster-addons/ first -- shown in the order it'll actually be destroyed.
      - name: Preview destroy of infra/cluster-addons/
        working-directory: infra/cluster-addons
        run: |
          terraform init
          terraform plan -destroy -refresh=false -lock=false -no-color

      - name: Preview destroy of infra/
        working-directory: infra
        run: |
          terraform init
          terraform plan -destroy -refresh=false -lock=false -no-color

  infra-destroy:
    needs: destroy-plan
    runs-on: ubuntu-latest
    # Same approval gate as infra-apply in ci.yml.
    environment: infra-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786830914740:role/ai-infra-project-github-actions-deploy
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: azure/setup-kubectl@v4

      # Karpenter-provisioned nodes were never created by Terraform (it
      # calls the EC2 API directly), so `terraform destroy` can't clean
      # them up -- and destroying cluster-addons/ next removes
      # Karpenter's own controller before it could notice and do it
      # itself. Deleting NodeClaims here, while the controller is still
      # running, triggers Karpenter's real graceful termination (drain,
      # evict, then terminate the instance) -- kubectl delete blocks
      # until that finalizer work actually finishes. Skipping this
      # orphaned a node for 20+ minutes and failed the whole workflow.
      #
      # Tolerates the cluster already being gone: "re-run failed jobs"
      # restarts from step 1, not where it left off, and a prior
      # attempt can have already destroyed the cluster while still
      # failing overall (e.g. on a later VPC/ENI cleanup step) --
      # without this check, the re-run fails here immediately and
      # skips the remaining, still-needed destroy steps.
      - name: Drain and terminate Karpenter-provisioned nodes
        run: |
          if ! aws eks describe-cluster --name ai-infra-project --region us-east-2 >/dev/null 2>&1; then
            echo "Cluster already gone -- nothing to drain."
            exit 0
          fi
          aws eks update-kubeconfig --name ai-infra-project --region us-east-2
          kubectl delete nodeclaims --all --wait=true --timeout=5m

      # cluster-addons/ must go first -- the Helm release's uninstall
      # needs the cluster's API server to still exist to process it.
      - name: Destroy infra/cluster-addons/
        working-directory: infra/cluster-addons
        run: |
          terraform init
          terraform destroy -auto-approve

      - name: Destroy infra/
        working-directory: infra
        run: |
          terraform init
          terraform destroy -auto-approve
