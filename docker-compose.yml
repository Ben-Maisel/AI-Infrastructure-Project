services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8501:8501"
    volumes:
      - ./docs/knowledge_base:/app/docs/knowledge_base
      - ./docs/vector_store:/app/docs/vector_store
      - ./agent_output:/app/agent_output
    restart: unless-stopped

volumes:
  ollama_data:
